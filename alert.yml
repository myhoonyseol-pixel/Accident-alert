name: accident-news-alert

# ─────────────────────────────────────────────────────────────
# 왜 이런 구조인가
# ─────────────────────────────────────────────────────────────
# GitHub 무료 스케줄러는 짧은 주기를 지키지 않습니다. 공식 문서도
# "지연은 예상된 동작"이라고 안내합니다. 실제로 */20 로 걸어두었더니
# 8시간에 4번만 돌았고, 밤 11시27분 이후 13시간이 통째로 비었습니다.
# 하필 새벽 사고를 감지해야 하는 시간대였습니다.
#
# 그래서 "20분마다 깨워달라"고 부탁하는 대신,
# **한 번 깨어나면 스스로 5시간 30분 동안 20분마다 확인**하도록 바꿨습니다.
# 이제 한 시간에 한 번만 깨워줘도 감시가 끊기지 않습니다.
# (Public 저장소는 실행 시간이 무제한 무료라 비용은 그대로 0원입니다)
# ─────────────────────────────────────────────────────────────

on:
  schedule:
    # 매시 7분. 정각은 전 세계 작업이 몰려 가장 밀리는 시각이라 피합니다.
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: accident-alert
  # 새로 깨어나면 돌고 있던 루프를 대체합니다.
  # 상태는 매 회차마다 저장하므로 잃어봐야 한 회차뿐입니다.
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # 5시간 50분 (GitHub 작업 한도 6시간)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Poll loop
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_REFRESH_TOKENS: ${{ secrets.KAKAO_REFRESH_TOKENS }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          set -u
          INTERVAL=1200                       # 20분
          DEADLINE=$(( $(date +%s) + 330*60 ))  # 5시간 30분 뒤 종료
          ROUND=0

          git config user.name  "github-actions"
          git config user.email "actions@github.com"

          while :; do
            ROUND=$((ROUND+1))
            echo "──────── ${ROUND}회차  $(TZ=Asia/Seoul date '+%m-%d %H:%M KST') ────────"

            if ! python main.py; then
              echo "::error::감시 스크립트 실패 — 루프를 멈춥니다."
              echo "카카오 토큰 만료(KOE010)가 가장 흔한 원인입니다. 위 로그를 확인하세요."
              exit 1
            fi

            # 이미 보낸 기사 기록을 저장소에 남깁니다.
            # 이 컴퓨터는 끝나면 사라지므로, 안 남기면 다음에 같은 사고를 또 보냅니다.
            git add state/seen.json 2>/dev/null || true
            if ! git diff --staged --quiet 2>/dev/null; then
              git commit -q -m "chore: update seen state [skip ci]"
              for i in 1 2 3; do
                if git pull --rebase --autostash -q && git push -q; then break; fi
                echo "push 재시도 $i"; sleep 5
              done
            fi

            NOW=$(date +%s)
            REMAIN=$(( DEADLINE - NOW ))
            if [ "$REMAIN" -le "$INTERVAL" ]; then
              echo "예정 시간 종료. 다음 실행이 이어받습니다."
              break
            fi
            sleep "$INTERVAL"
          done
