name: accident-news-alert

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: accident-alert
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Poll loop
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_REFRESH_TOKENS: ${{ secrets.KAKAO_REFRESH_TOKENS }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          set -u
          INTERVAL=1200
          DEADLINE=$(( $(date +%s) + 330*60 ))
          ROUND=0

          git config user.name  "github-actions"
          git config user.email "actions@github.com"

          while :; do
            ROUND=$((ROUND+1))
            echo "──────── ${ROUND}회차  $(TZ=Asia/Seoul date '+%m-%d %H:%M KST') ────────"

            if ! python main.py; then
              echo "::error::감시 스크립트 실패 — 루프를 멈춥니다."
              echo "카카오 토큰 만료(KOE010)가 가장 흔한 원인입니다. 위 로그를 확인하세요."
              exit 1
            fi

            git add state/seen.json 2>/dev/null || true
            if ! git diff --staged --quiet 2>/dev/null; then
              git commit -q -m "chore: update seen state [skip ci]"
              for i in 1 2 3; do
                if git pull --rebase --autostash -q && git push -q; then break; fi
                echo "push 재시도 $i"; sleep 5
              done
            fi

            NOW=$(date +%s)
            REMAIN=$(( DEADLINE - NOW ))
            if [ "$REMAIN" -le "$INTERVAL" ]; then
              echo "예정 시간 종료. 다음 실행이 이어받습니다."
              break
            fi
            sleep "$INTERVAL"
          done
