name: verify-gpt-model

# 임시 검증용 — GPT 모델 변경(gpt-6-luna) 호환성 확인. 병합 전에 지웁니다.
# 가상의 기사 3건을 운영 판정 함수(ai_judge_gpt.judge)에 그대로 넣고,
# 실제 응답 모델·상태·토큰·파싱 결과만 찍습니다. 아무 데도 발송하지 않습니다.

on:
  push:
    branches: [claude/construction-alert-token-optimization-2uvn7c]
    paths: [.github/workflows/verify_gpt_model.yml, ai_judge_gpt.py]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import os, requests, config, ai_judge_gpt
          real = requests.post
          def post(*a, **k):
              r = real(*a, **k)
              try:
                  b = r.json()
                  u = b.get("usage", {}) or {}
                  det = (u.get("output_tokens_details") or {}).get("reasoning_tokens")
                  print(f"  [응답] HTTP {r.status_code} · 요청 {k['json']['model']} · 실제 모델 {b.get('model')} "
                        f"· 상태 {b.get('status')} · 입력 {u.get('input_tokens')} / 출력 {u.get('output_tokens')} (추론 {det})"
                        + (f" · 오류 {b.get('error')}" if b.get('error') else "")
                        + (f" · 미완료 {b.get('incomplete_details')}" if b.get('incomplete_details') else ""))
              except Exception as e:
                  print(f"  [응답] HTTP {r.status_code} · JSON 아님: {e} · {r.text[:200]}")
              return r
          ai_judge_gpt.requests.post = post
          cands = [
              ({"title": "경기 한 아파트 신축 공사현장서 50대 작업자 추락해 숨져", "link": "a",
                "body": "오늘 오전 경기도의 한 아파트 신축 공사현장에서 50대 작업자가 10m 아래로 추락해 숨졌다. 시공사는 OO건설이다."}, "공사현장", ["추락", "숨져"], "place"),
              ({"title": "올해 건설현장 사망자 통계 발표…추락이 절반", "link": "b",
                "body": "고용노동부는 올해 건설현장 사망자 통계를 발표했다."}, "건설현장", ["사망"], "place"),
              ({"title": "공장 화재 진화…인명피해 없어", "link": "c",
                "body": "공장에서 불이 나 1시간 만에 꺼졌다. 인명피해는 없었다."}, "공장", ["화재"], "place"),
          ]
          for m in ["gpt-5.6-luna", ""]:
              os.environ["OPENAI_MODEL"] = m
              label = m or f"기본값 DEFAULT_MODEL={ai_judge_gpt.DEFAULT_MODEL}"
              print(f"\n===== {label} =====")
              rows = ai_judge_gpt.judge(cands, config, [], [])
              for row in rows:
                  v = row[4]
                  print(f"  {v.get('decision'):8s} {v.get('type'):10s} v={v.get('v')} co={v.get('co')!r} "
                        f"model={v.get('model')} · {row[0]['title'][:30]} · {str(v.get('why',''))[:50]}")
          PY
